<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Run Away 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }
    #hud {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-weight: 700; font-size: 16px; z-index: 10;
      text-shadow: 0 2px 6px rgba(0,0,0,0.65);
    }
    .badge {
      background: rgba(15, 23, 42, 0.75); padding: 8px 14px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(10, 15, 28, 0.84);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 24px; z-index: 20;
    }
    #overlay h1 { font-size: 36px; margin: 0 0 10px; letter-spacing: 1px; }
    #overlay p { font-size: 16px; color: #cbd5e1; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
    #startBtn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: none; color: #fff; font-size: 20px; font-weight: 800;
      padding: 16px 36px; border-radius: 18px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45);
    }
    #startBtn:active { transform: scale(0.96); }
    #chaserWarn {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92); color: #fff; font-weight: 700;
      padding: 8px 16px; border-radius: 12px; font-size: 14px;
      opacity: 0; transition: opacity 0.25s; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge">Счёт: <span id="score">0</span></div>
    <div class="badge">Монеты: <span id="coins">0</span></div>
    <div class="badge">Рекорд: <span id="best">0</span></div>
  </div>
  <div id="chaserWarn">Осторожно! Преследователь совсем рядом!</div>

  <div id="overlay">
    <h1 id="title">RUN AWAY 3D</h1>
    <p id="subtitle">Свайпай влево/вправо для смены пути, вверх — прыжок, вниз — подкат. Убеги от погони!</p>
    <button id="startBtn">ИГРАТЬ</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const startBtn = document.getElementById('startBtn');
    const chaserWarn = document.getElementById('chaserWarn');

    let bestScore = Number(localStorage.getItem('runaway_best') || 0);
    bestEl.textContent = bestScore;

    // --- ГЕНЕРАЦИЯ ТЕКСТУР ---
    function createTrackTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      // Гравий
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 3000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#475569' : '#1e293b';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 4, 4);
      }
      // 3 пути (шпалы и рельсы)
      const centers = [85, 256, 427];
      centers.forEach(cx => {
        // Шпалы
        ctx.fillStyle = '#451a03';
        for (let y = 0; y < 512; y += 32) {
          ctx.fillRect(cx - 52, y + 6, 104, 16);
        }
        // Рельсы
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(cx - 34, 0, 8, 512);
        ctx.fillRect(cx + 26, 0, 8, 512);
      });
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 28);
      return tex;
    }

    function createStripeTexture(c1, c2) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = c1;
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = c2;
      for (let i = -128; i < 256; i += 32) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i + 16, 0);
        ctx.lineTo(i - 16, 128); ctx.lineTo(i - 32, 128);
        ctx.closePath(); ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createTrainTexture(bodyColor, stripeColor) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bodyColor;
      ctx.fillRect(0, 0, 256, 256);
      // Полоса по борту
      ctx.fillStyle = stripeColor;
      ctx.fillRect(0, 150, 256, 28);
      // Окна
      ctx.fillStyle = '#0f172a';
      for (let x = 18; x < 230; x += 58) {
        ctx.fillRect(x, 45, 42, 75);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(x + 4, 49, 34, 67);
        ctx.fillStyle = '#0f172a';
      }
      return new THREE.CanvasTexture(c);
    }

    function createBuildingTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 128, 256);
      for (let y = 16; y < 240; y += 34) {
        for (let x = 16; x < 110; x += 34) {
          ctx.fillStyle = Math.random() > 0.35 ? '#fde047' : '#0f172a';
          ctx.fillRect(x, y, 20, 22);
        }
      }
      return new THREE.CanvasTexture(c);
    }

    const trackTex = createTrackTexture();
    const barrierTex = createStripeTexture('#f97316', '#ffffff');
    const highBarrierTex = createStripeTexture('#9333ea', '#fde047');
    const trainSideTex = createTrainTexture('#2563eb', '#facc15');
    const buildingTex = createBuildingTexture();

    // --- СЦЕНА И КАМЕРА ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.Fog(0x38bdf8, 35, 110);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(0, 5.4, 8.6);
    camera.lookAt(0, 1.6, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Освещение
    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.95));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(12, 22, 14);
    scene.add(dirLight);

    // Железнодорожное полотно
    const LANES = [-2.5, 0, 2.5];
    const road = new THREE.Mesh(
      new THREE.BoxGeometry(8.4, 0.5, 220),
      new THREE.MeshStandardMaterial({ map: trackTex })
    );
    road.position.set(0, -0.25, -80);
    scene.add(road);

    // Платформы и здания по бокам
    const sideMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
    [-6.2, 6.2].forEach(x => {
      const curb = new THREE.Mesh(new THREE.BoxGeometry(4, 0.7, 220), sideMat);
      curb.position.set(x, -0.1, -80);
      scene.add(curb);
    });

    const buildings = [];
    const bMat = new THREE.MeshStandardMaterial({ map: buildingTex });
    for (let z = 10; z > -140; z -= 18) {
      [-9.5, 9.5].forEach(x => {
        const h = 10 + Math.random() * 12;
        const b = new THREE.Mesh(new THREE.BoxGeometry(5, h, 10), bMat);
        b.position.set(x, h / 2 - 0.5, z);
        scene.add(b);
        buildings.push(b);
      });
    }

    // --- СОЗДАНИЕ 3D ПЕРСОНАЖА ---
    function createCharacter(shirtColor, pantsColor, hatColor) {
      const group = new THREE.Group();

      // Туловище (худи)
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.85, 0.95, 0.5),
        new THREE.MeshStandardMaterial({ color: shirtColor })
      );
      torso.position.y = 1.15;
      group.add(torso);

      // Рюкзак
      const bag = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, 0.7, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xf59e0b })
      );
      bag.position.set(0, 1.18, 0.35);
      group.add(bag);

      // Голова
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, 0.62, 0.62),
        new THREE.MeshStandardMaterial({ color: 0xfed7aa })
      );
      head.position.y = 1.98;
      group.add(head);

      // Кепка
      const cap = new THREE.Mesh(
        new THREE.BoxGeometry(0.66, 0.22, 0.66),
        new THREE.MeshStandardMaterial({ color: hatColor })
      );
      cap.position.y = 2.32;
      group.add(cap);

      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.08, 0.35),
        new THREE.MeshStandardMaterial({ color: hatColor })
      );
      visor.position.set(0, 2.25, 0.38); // Козырёк назад!
      group.add(visor);

      // Руки
      const armGeo = new THREE.BoxGeometry(0.24, 0.8, 0.24);
      const armMat = new THREE.MeshStandardMaterial({ color: shirtColor });
      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-0.58, 1.15, 0);
      const rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.position.set(0.58, 1.15, 0);
      group.add(leftArm, rightArm);

      // Ноги
      const legGeo = new THREE.BoxGeometry(0.32, 0.75, 0.34);
      const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.22, 0.38, 0);
      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.22, 0.38, 0);
      group.add(leftLeg, rightLeg);

      return { group, leftArm, rightArm, leftLeg, rightLeg };
    }

    const playerRig = createCharacter(0x0284c7, 0x1e293b, 0xef4444);
    scene.add(playerRig.group);

    const chaserRig = createCharacter(0x111827, 0x0f172a, 0x2563eb);
    chaserRig.group.scale.set(1.15, 1.15, 1.15);
    chaserRig.group.position.set(0, 0, 4.2);
    scene.add(chaserRig.group);

    // --- СОСТОЯНИЕ ИГРЫ ---
    let running = false;
    let currentLane = 1;
    let vy = 0;
    let isJumping = false;
    let slideTimer = 0;
    let chaserDist = 3.6;
    let speed = 24;
    let score = 0;
    let coins = 0;
    let spawnTimer = 0;
    let runCycle = 0;
    let obstacles = [];
    let coinItems = [];

    function resetGame() {
      obstacles.forEach(o => scene.remove(o.mesh));
      coinItems.forEach(c => scene.remove(c));
      obstacles = [];
      coinItems = [];
      currentLane = 1;
      playerRig.group.position.set(0, 0, 0);
      playerRig.group.rotation.set(0, 0, 0);
      playerRig.group.scale.set(1, 1, 1);
      vy = 0;
      isJumping = false;
      slideTimer = 0;
      chaserDist = 3.4;
      speed = 24;
      score = 0;
      coins = 0;
      spawnTimer = 0;
      scoreEl.textContent = '0';
      coinsEl.textContent = '0';
      chaserWarn.style.opacity = '0';
      running = true;
      overlay.style.display = 'none';
    }

    function spawnRow() {
      const freeLane = Math.floor(Math.random() * 3);
      for (let i = 0; i < 3; i++) {
        if (i === freeLane) {
          if (Math.random() < 0.75) {
            const coin = new THREE.Mesh(
              new THREE.CylinderGeometry(0.45, 0.45, 0.16, 18),
              new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, metalness: 0.4 })
            );
            coin.rotation.x = Math.PI / 2;
            coin.position.set(LANES[i], 1.1, -95);
            scene.add(coin);
            coinItems.push(coin);
          }
          continue;
        }
        if (Math.random() < 0.32) continue;

        const r = Math.random();
        let type = 'low';
        let mesh;
        if (r < 0.4) {
          type = 'low'; // Барьер — перепрыгнуть
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.85, 1.05, 0.45),
            new THREE.MeshStandardMaterial({ map: barrierTex })
          );
          mesh.position.set(LANES[i], 0.52, -95);
        } else if (r < 0.72) {
          type = 'high'; // Высокий щит — подкат
          const group = new THREE.Group();
          const board = new THREE.Mesh(
            new THREE.BoxGeometry(1.95, 1.2, 0.4),
            new THREE.MeshStandardMaterial({ map: highBarrierTex })
          );
          board.position.y = 2.05;
          const postL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.6, 0.16), sideMat);
          postL.position.set(-0.9, 1.3, 0);
          const postR = postL.clone();
          postR.position.x = 0.9;
          group.add(board, postL, postR);
          group.position.set(LANES[i], 0, -95);
          mesh = group;
        } else {
          type = 'train'; // Вагон поезда — сменить путь
          const trainGroup = new THREE.Group();
          const body = new THREE.Mesh(
            new THREE.BoxGeometry(2.0, 2.7, 7.5),
            new THREE.MeshStandardMaterial({ map: trainSideTex })
          );
          body.position.y = 1.35;
          // Фары спереди
          const lightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
          const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.1), lightMat);
          hl1.position.set(-0.55, 0.7, 3.76);
          const hl2 = hl1.clone();
          hl2.position.x = 0.55;
          trainGroup.add(body, hl1, hl2);
          trainGroup.position.set(LANES[i], 0, -98);
          mesh = trainGroup;
        }
        scene.add(mesh);
        obstacles.push({ mesh, type, lane: i, grazed: false });
      }
    }

    function gameOver() {
      running = false;
      const finalScore = Math.floor(score);
      if (finalScore > bestScore) {
        bestScore = finalScore;
        localStorage.setItem('runaway_best', bestScore);
        bestEl.textContent = bestScore;
      }
      titleEl.textContent = 'ПОЙМАН!';
      subtitleEl.textContent = `Счёт: ${finalScore} | Монеты: ${coins}`;
      startBtn.textContent = 'ЕЩЁ РАЗ';
      overlay.style.display = 'flex';
    }

    // Управление свайпами
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (!running) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && currentLane < 2) currentLane++;
        else if (dx < 0 && currentLane > 0) currentLane--;
      } else {
        if (dy < 0 && !isJumping) {
          vy = 16;
          isJumping = true;
          slideTimer = 0;
        } else if (dy > 0) {
          slideTimer = 0.65;
          if (isJumping) vy = -19;
        }
      }
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (!running) return;
      if (e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
      if (e.key === 'ArrowRight' && currentLane < 2) currentLane++;
      if (e.key === 'ArrowUp' && !isJumping) { vy = 16; isJumping = true; slideTimer = 0; }
      if (e.key === 'ArrowDown') { slideTimer = 0.65; if (isJumping) vy = -19; }
    });

    startBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (running) {
        speed += dt * 0.45;
        score += dt * speed * 0.5;
        scoreEl.textContent = Math.floor(score);

        // Прокрутка текстуры рельсов и зданий
        trackTex.offset.y -= dt * speed * 0.127;
        buildings.forEach(b => {
          b.position.z += speed * dt;
          if (b.position.z > 20) b.position.z -= 162;
        });

        // Плавная смена полосы и наклон корпуса
        const targetX = LANES[currentLane];
        const diffX = targetX - playerRig.group.position.x;
        playerRig.group.position.x += diffX * Math.min(1, dt * 15);
        playerRig.group.rotation.z = -diffX * 0.14;

        // Прыжок
        if (isJumping || playerRig.group.position.y > 0) {
          playerRig.group.position.y += vy * dt;
          vy -= 44 * dt;
          if (playerRig.group.position.y <= 0) {
            playerRig.group.position.y = 0;
            vy = 0;
            isJumping = false;
          }
        }

        // Подкат
        if (slideTimer > 0) {
          slideTimer -= dt;
          playerRig.group.scale.y = 0.48;
          playerRig.group.rotation.x = -0.35;
        } else {
          playerRig.group.scale.y = 1;
          playerRig.group.rotation.x = 0;
        }

        // Анимация бега персонажа и преследователя
        runCycle += dt * speed * 0.55;
        const swing = Math.sin(runCycle) * 0.85;
        if (isJumping) {
          playerRig.leftLeg.rotation.x = 0.6;
          playerRig.rightLeg.rotation.x = -0.5;
          playerRig.leftArm.rotation.x = -0.9;
          playerRig.rightArm.rotation.x = -0.9;
        } else {
          playerRig.leftLeg.rotation.x = swing;
          playerRig.rightLeg.rotation.x = -swing;
          playerRig.leftArm.rotation.x = -swing * 0.8;
          playerRig.rightArm.rotation.x = swing * 0.8;
        }

        chaserDist = Math.min(6.5, chaserDist + dt * 0.35);
        chaserRig.group.position.x += (playerRig.group.position.x - chaserRig.group.position.x) * Math.min(1, dt * 8);
        chaserRig.group.position.z = chaserDist;
        chaserRig.leftLeg.rotation.x = -swing;
        chaserRig.rightLeg.rotation.x = swing;
        chaserRig.leftArm.rotation.x = swing * 0.9;
        chaserRig.rightArm.rotation.x = -swing * 0.9;
        chaserWarn.style.opacity = chaserDist < 2.7 ? '1' : '0';

        // Спавн препятствий
        spawnTimer -= dt * speed;
        if (spawnTimer <= 0) {
          spawnRow();
          spawnTimer = 20;
        }

        // Столкновения
        const playerBottom = playerRig.group.position.y;
        const playerTop = playerRig.group.position.y + 2.35 * playerRig.group.scale.y;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.mesh.position.z += speed * dt;

          const halfZ = ob.type === 'train' ? 3.7 : 0.4;
          if (Math.abs(ob.mesh.position.z - playerRig.group.position.z) < halfZ + 0.4 &&
              Math.abs(ob.mesh.position.x - playerRig.group.position.x) < 1.0) {
            if (ob.type === 'low' && playerBottom > 0.95) {
              // Перепрыгнул
            } else if (ob.type === 'high' && playerTop < 1.38) {
              // Проскользнул снизу
            } else if (ob.type === 'train') {
              gameOver();
              break;
            } else if (!ob.grazed) {
              ob.grazed = true;
              chaserDist -= 2.2;
              if (chaserDist <= 1.25) {
                gameOver();
                break;
              }
            }
          }

          if (ob.mesh.position.z > 16) {
            scene.remove(ob.mesh);
            obstacles.splice(i, 1);
          }
        }

        // Монеты
        for (let i = coinItems.length - 1; i >= 0; i--) {
          const c = coinItems[i];
          c.position.z += speed * dt;
          c.rotation.z += dt * 4.5;
          if (Math.abs(c.position.z - playerRig.group.position.z) < 1.0 &&
              Math.abs(c.position.x - playerRig.group.position.x) < 1.1 &&
              Math.abs(c.position.y - (playerBottom + 1.0)) < 1.3) {
            coins++;
            score += 25;
            coinsEl.textContent = coins;
            scene.remove(c);
            coinItems.splice(i, 1);
            continue;
          }
          if (c.position.z > 16) {
            scene.remove(c);
            coinItems.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }
    animate(performance.now());
  </script>
</body>
</html>
