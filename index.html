<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Run Away 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }
    #hud {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-weight: 700; font-size: 16px; z-index: 10;
      text-shadow: 0 2px 6px rgba(0,0,0,0.65);
    }
    .badge {
      background: rgba(15, 23, 42, 0.75); padding: 8px 14px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.18);
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(10, 15, 28, 0.82);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 24px; z-index: 20;
    }
    #overlay h1 { font-size: 36px; margin: 0 0 10px; letter-spacing: 1px; }
    #overlay p { font-size: 16px; color: #cbd5e1; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
    #startBtn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: none; color: #fff; font-size: 20px; font-weight: 800;
      padding: 16px 36px; border-radius: 18px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45);
    }
    #startBtn:active { transform: scale(0.96); }
    #chaserWarn {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92); color: #fff; font-weight: 700;
      padding: 8px 16px; border-radius: 12px; font-size: 14px;
      opacity: 0; transition: opacity 0.25s; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge">Счёт: <span id="score">0</span></div>
    <div class="badge">Монеты: <span id="coins">0</span></div>
    <div class="badge">Рекорд: <span id="best">0</span></div>
  </div>
  <div id="chaserWarn">Осторожно! Преследователь совсем рядом!</div>

  <div id="overlay">
    <h1 id="title">RUN AWAY 3D</h1>
    <p id="subtitle">Свайпай влево/вправо для смены пути, вверх — прыжок, вниз — подкат. Убеги от погони!</p>
    <button id="startBtn">ИГРАТЬ</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const startBtn = document.getElementById('startBtn');
    const chaserWarn = document.getElementById('chaserWarn');

    let bestScore = Number(localStorage.getItem('runaway_best') || 0);
    bestEl.textContent = bestScore;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.Fog(0x38bdf8, 35, 110);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(0, 5.4, 8.6);
    camera.lookAt(0, 1.6, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.95));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(12, 22, 14);
    scene.add(dirLight);

    // Дорога и полосы
    const LANES = [-2.5, 0, 2.5];
    const road = new THREE.Mesh(
      new THREE.BoxGeometry(8.6, 0.5, 220),
      new THREE.MeshStandardMaterial({ color: 0x334155 })
    );
    road.position.set(0, -0.25, -80);
    scene.add(road);

    // Рельсы по 3 путям
    const railMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
    LANES.forEach(cx => {
      [-0.55, 0.55].forEach(offset => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 220), railMat);
        rail.position.set(cx + offset, 0.06, -80);
        scene.add(rail);
      });
    });

    // Здания по бокам
    const buildings = [];
    const bColors = [0x1e293b, 0x334155, 0x0f172a, 0x475569];
    for (let z = 10; z > -140; z -= 18) {
      [-9.5, 9.5].forEach((x, idx) => {
        const h = 10 + ((Math.abs(z) + idx * 5) % 12);
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(5, h, 10),
          new THREE.MeshStandardMaterial({ color: bColors[(Math.abs(z) + idx) % bColors.length] })
        );
        b.position.set(x, h / 2 - 0.5, z);
        scene.add(b);
        buildings.push(b);
      });
    }

    // Округлый 3D персонаж
    function createRoundCharacter(shirtColor, pantsColor, hatColor) {
      const group = new THREE.Group();

      const torso = new THREE.Mesh(
        new THREE.SphereGeometry(0.56, 20, 16),
        new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.45 })
      );
      torso.scale.set(1.08, 1.15, 0.95);
      torso.position.y = 1.15;
      group.add(torso);

      const bag = new THREE.Mesh(
        new THREE.SphereGeometry(0.36, 16, 14),
        new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.5 })
      );
      bag.scale.set(1.0, 1.1, 0.78);
      bag.position.set(0, 1.2, 0.42);
      group.add(bag);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 20, 16),
        new THREE.MeshStandardMaterial({ color: 0xfed7aa, roughness: 0.5 })
      );
      head.position.y = 2.02;
      group.add(head);

      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55),
        new THREE.MeshStandardMaterial({ color: hatColor, roughness: 0.45 })
      );
      cap.position.y = 2.08;
      group.add(cap);

      const armGeo = new THREE.SphereGeometry(0.16, 14, 12);
      const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.45 });

      const leftArm = new THREE.Group();
      leftArm.position.set(-0.64, 1.38, 0);
      const leftArmMesh = new THREE.Mesh(armGeo, armMat);
      leftArmMesh.scale.set(0.9, 1.9, 0.9);
      leftArmMesh.position.y = -0.25;
      leftArm.add(leftArmMesh);

      const rightArm = new THREE.Group();
      rightArm.position.set(0.64, 1.38, 0);
      const rightArmMesh = new THREE.Mesh(armGeo, armMat);
      rightArmMesh.scale.set(0.9, 1.9, 0.9);
      rightArmMesh.position.y = -0.25;
      rightArm.add(rightArmMesh);

      group.add(leftArm, rightArm);

      const legGeo = new THREE.SphereGeometry(0.2, 14, 12);
      const legMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.55 });

      const leftLeg = new THREE.Group();
      leftLeg.position.set(-0.24, 0.72, 0);
      const leftLegMesh = new THREE.Mesh(legGeo, legMat);
      leftLegMesh.scale.set(0.95, 1.65, 1.05);
      leftLegMesh.position.y = -0.28;
      leftLeg.add(leftLegMesh);

      const rightLeg = new THREE.Group();
      rightLeg.position.set(0.24, 0.72, 0);
      const rightLegMesh = new THREE.Mesh(legGeo, legMat);
      rightLegMesh.scale.set(0.95, 1.65, 1.05);
      rightLegMesh.position.y = -0.28;
      rightLeg.add(rightLegMesh);

      group.add(leftLeg, rightLeg);

      return { group, leftArm, rightArm, leftLeg, rightLeg };
    }

    const playerRig = createRoundCharacter(0x0284c7, 0x1e293b, 0xef4444);
    scene.add(playerRig.group);

    const chaserRig = createRoundCharacter(0x111827, 0x0f172a, 0x2563eb);
    chaserRig.group.scale.set(1.15, 1.15, 1.15);
    chaserRig.group.position.set(0, 0, 4.2);
    scene.add(chaserRig.group);

    let running = false;
    let currentLane = 1;
    let vy = 0;
    let isJumping = false;
    let slideTimer = 0;
    let chaserDist = 3.6;
    let speed = 24;
    let score = 0;
    let coins = 0;
    let spawnTimer = 0;
    let runCycle = 0;
    let obstacles = [];
    let coinItems = [];

    function resetGame() {
      obstacles.forEach(o => scene.remove(o.mesh));
      coinItems.forEach(c => scene.remove(c));
      obstacles = [];
      coinItems = [];
      currentLane = 1;
      playerRig.group.position.set(0, 0, 0);
      playerRig.group.rotation.set(0, 0, 0);
      playerRig.group.scale.set(1, 1, 1);
      vy = 0;
      isJumping = false;
      slideTimer = 0;
      chaserDist = 3.4;
      speed = 24;
      score = 0;
      coins = 0;
      spawnTimer = 0;
      scoreEl.textContent = '0';
      coinsEl.textContent = '0';
      chaserWarn.style.opacity = '0';
      running = true;
      overlay.style.display = 'none';
    }

    function spawnRow() {
      const freeLane = Math.floor(Math.random() * 3);
      for (let i = 0; i < 3; i++) {
        if (i === freeLane) {
          if (Math.random() < 0.75) {
            const coin = new THREE.Mesh(
              new THREE.CylinderGeometry(0.45, 0.45, 0.16, 18),
              new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04 })
            );
            coin.rotation.x = Math.PI / 2;
            coin.position.set(LANES[i], 1.1, -95);
            scene.add(coin);
            coinItems.push(coin);
          }
          continue;
        }
        if (Math.random() < 0.32) continue;

        const r = Math.random();
        let type = 'low';
        let mesh;
        if (r < 0.4) {
          type = 'low';
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.85, 1.05, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xf97316 })
          );
          mesh.position.set(LANES[i], 0.52, -95);
        } else if (r < 0.72) {
          type = 'high';
          const group = new THREE.Group();
          const board = new THREE.Mesh(
            new THREE.BoxGeometry(1.95, 1.2, 0.45),
            new THREE.MeshStandardMaterial({ color: 0xa855f7 })
          );
          board.position.y = 2.05;
          group.add(board);
          group.position.set(LANES[i], 0, -95);
          mesh = group;
        } else {
          type = 'train';
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(2.0, 2.7, 7.5),
            new THREE.MeshStandardMaterial({ color: 0x2563eb })
          );
          mesh.position.set(LANES[i], 1.35, -98);
        }
        scene.add(mesh);
        obstacles.push({ mesh, type, lane: i, grazed: false });
      }
    }

    function gameOver() {
      running = false;
      const finalScore = Math.floor(score);
      if (finalScore > bestScore) {
        bestScore = finalScore;
        localStorage.setItem('runaway_best', bestScore);
        bestEl.textContent = bestScore;
      }
      titleEl.textContent = 'ПОЙМАН!';
      subtitleEl.textContent = `Счёт: ${finalScore} | Монеты: ${coins}`;
      startBtn.textContent = 'ЕЩЁ РАЗ';
      overlay.style.display = 'flex';
    }

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (!running) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && currentLane < 2) currentLane++;
        else if (dx < 0 && currentLane > 0) currentLane--;
      } else {
        if (dy < 0 && !isJumping) {
          vy = 16;
          isJumping = true;
          slideTimer = 0;
        } else if (dy > 0) {
          slideTimer = 0.65;
          if (isJumping) vy = -19;
        }
      }
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (!running) return;
      if (e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
      if (e.key === 'ArrowRight' && currentLane < 2) currentLane++;
      if (e.key === 'ArrowUp' && !isJumping) { vy = 16; isJumping = true; slideTimer = 0; }
      if (e.key === 'ArrowDown') { slideTimer = 0.65; if (isJumping) vy = -19; }
    });

    startBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (running) {
        speed += dt * 0.45;
        score += dt * speed * 0.5;
        scoreEl.textContent = Math.floor(score);

        buildings.forEach(b => {
          b.position.z += speed * dt;
          if (b.position.z > 20) b.position.z -= 162;
        });

        const targetX = LANES[currentLane];
        const diffX = targetX - playerRig.group.position.x;
        playerRig.group.position.x += diffX * Math.min(1, dt * 15);
        playerRig.group.rotation.z = -diffX * 0.14;

        if (isJumping || playerRig.group.position.y > 0) {
          playerRig.group.position.y += vy * dt;
          vy -= 44 * dt;
          if (playerRig.group.position.y <= 0) {
            playerRig.group.position.y = 0;
            vy = 0;
            isJumping = false;
          }
        }

        if (slideTimer > 0) {
          slideTimer -= dt;
          playerRig.group.scale.y = 0.48;
          playerRig.group.rotation.x = -0.35;
        } else {
          playerRig.group.scale.y = 1;
          playerRig.group.rotation.x = 0;
        }

        runCycle += dt * speed * 0.55;
        const swing = Math.sin(runCycle) * 0.85;
        if (isJumping) {
          playerRig.leftLeg.rotation.x = 0.6;
          playerRig.rightLeg.rotation.x = -0.5;
          playerRig.leftArm.rotation.x = -0.9;
          playerRig.rightArm.rotation.x = -0.9;
        } else {
          playerRig.leftLeg.rotation.x = swing;
          playerRig.rightLeg.rotation.x = -swing;
          playerRig.leftArm.rotation.x = -swing * 0.8;
          playerRig.rightArm.rotation.x = swing * 0.8;
        }

        chaserDist = Math.min(6.5, chaserDist + dt * 0.35);
        chaserRig.group.position.x += (playerRig.group.position.x - chaserRig.group.position.x) * Math.min(1, dt * 8);
        chaserRig.group.position.z = chaserDist;
        chaserRig.leftLeg.rotation.x = -swing;
        chaserRig.rightLeg.rotation.x = swing;
        chaserRig.leftArm.rotation.x = swing * 0.9;
        chaserRig.rightArm.rotation.x = -swing * 0.9;
        chaserWarn.style.opacity = chaserDist < 2.7 ? '1' : '0';

        spawnTimer -= dt * speed;
        if (spawnTimer <= 0) {
          spawnRow();
          spawnTimer = 20;
        }

        const playerBottom = playerRig.group.position.y;
        const playerTop = playerRig.group.position.y + 2.4 * playerRig.group.scale.y;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.mesh.position.z += speed * dt;

          const halfZ = ob.type === 'train' ? 3.7 : 0.4;
          if (Math.abs(ob.mesh.position.z - playerRig.group.position.z) < halfZ + 0.4 &&
              Math.abs(ob.mesh.position.x - playerRig.group.position.x) < 1.0) {
            if (ob.type === 'low' && playerBottom > 0.95) {
              // Перепрыгнул
            } else if (ob.type === 'high' && playerTop < 1.38) {
              // Проскользнул снизу
            } else if (ob.type === 'train') {
              gameOver();
              break;
            } else if (!ob.grazed) {
              ob.grazed = true;
              chaserDist -= 2.2;
              if (chaserDist <= 1.25) {
                gameOver();
                break;
              }
            }
          }

          if (ob.mesh.position.z > 16) {
            scene.remove(ob.mesh);
            obstacles.splice(i, 1);
          }
        }

        for (let i = coinItems.length - 1; i >= 0; i--) {
          const c = coinItems[i];
          c.position.z += speed * dt;
          c.rotation.z += dt * 4.5;
          if (Math.abs(c.position.z - playerRig.group.position.z) < 1.0 &&
              Math.abs(c.position.x - playerRig.group.position.x) < 1.1 &&
              Math.abs(c.position.y - (playerBottom + 1.0)) < 1.3) {
            coins++;
            score += 25;
            coinsEl.textContent = coins;
            scene.remove(c);
            coinItems.splice(i, 1);
            continue;
          }
          if (c.position.z > 16) {
            scene.remove(c);
            coinItems.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }
    animate(performance.now());
  </script>
</body>
</html>
